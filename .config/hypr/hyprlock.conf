source=~/.config/hypr/hyprlock/colors.conf

background {
    color = rgba(000000ff)
}
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 1
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = false
    rounding = 25
    fail_color = $alert_color

    capslock_color = $alert_color
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 84
    font_family = $font_family_clock

    position = 0, 180
    halign = center
    valign = center
}
label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 17
    font_family = $font_family

    position = 0, 105
    halign = center
    valign = center
}

